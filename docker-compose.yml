services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-dashboard
    ports:
      - "${WEB_PORT:-5173}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
