server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints asset filenames, so they can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is never cached, otherwise a deploy leaves browsers pointing
    # at asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client side routing: every unknown path is handled by the app, not 404ed
    # by nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
